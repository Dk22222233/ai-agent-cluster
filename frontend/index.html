<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f0f13;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* --- Views --- */
  .view { min-height: 100vh; }
  #login-view { display: grid; place-items: center; padding: 20px; }
  #loading-view { display: grid; place-items: center; }
  .loading { color: #8a8a94; font-size: 14px; animation: pulse 1.5s infinite; }

  /* --- Login Card --- */
  .card {
    background: #17171d;
    padding: 36px;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  }
  .card h1 { font-size: 26px; letter-spacing: -0.3px; }
  .sub { color: #8a8a94; margin: 8px 0 24px; font-size: 14px; }

  .google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2c2c36;
    background: #fff;
    color: #111;
    cursor: pointer;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .google-btn:hover { background: #f2f2f2; }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .divider { text-align: center; color: #555; margin: 18px 0; font-size: 12px; }

  .form { display: flex; flex-direction: column; gap: 10px; }

  .input {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2c2c36;
    background: #0f0f13;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .input:focus { border-color: #7c5cff; }

  .primary {
    padding: 12px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(135deg, #7c5cff, #5c8bff);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .primary:hover:not(:disabled) { opacity: 0.92; }
  .primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .error { color: #ff6b6b; font-size: 13px; }

  .toggle { color: #8a8a94; font-size: 13px; text-align: center; margin-top: 20px; }
  .toggle a { color: #7c5cff; text-decoration: none; }
  .toggle a:hover { text-decoration: underline; }

  /* --- Chat Layout --- */
  .chat-layout { height: 100vh; display: flex; flex-direction: column; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #1f1f28;
    flex-shrink: 0;
    gap: 12px;
  }
  .brand { font-weight: 700; font-size: 16px; }
  .user { color: #8a8a94; font-size: 12px; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .ghost {
    background: transparent;
    border: 1px solid #2c2c36;
    color: #cfcfd6;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ghost:hover:not(:disabled) { background: #1b1b23; }
  .ghost:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- Messages --- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2c2c36; border-radius: 4px; }

  .empty {
    margin: auto;
    text-align: center;
    color: #8a8a94;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 15px;
  }
  .emoji { font-size: 44px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .bubble.user {
    background: linear-gradient(135deg, #7c5cff, #5c8bff);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: #1b1b23;
    color: #e8e8ee;
    border-bottom-left-radius: 4px;
  }
  .bubble.bot.thinking {
    color: #8a8a94;
    font-style: italic;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .err-bar {
    background: #3a1a1a;
    color: #ff8c8c;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    align-self: center;
    max-width: 90%;
  }

  /* --- Footer --- */
  .footer {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid #1f1f28;
    flex-shrink: 0;
  }
  .textarea {
    flex: 1;
    resize: none;
    background: #17171d;
    color: #fff;
    border: 1px solid #2c2c36;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    max-height: 160px;
    min-height: 44px;
    transition: border-color 0.15s;
  }
  .textarea:focus { border-color: #7c5cff; }

  .send-btn {
    padding: 0 22px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(135deg, #7c5cff, #5c8bff);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { opacity: 0.92; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- Toast Notifications --- */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1000;
    pointer-events: none;
  }
  .toast {
    background: #1b1b23;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    border: 1px solid #2c2c36;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideUp 0.3s ease-out forwards;
    pointer-events: auto;
  }
  .toast.success { border-color: #34A853; }
  .toast.error { border-color: #ff6b6b; }
  
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(10px); }
  }

  @media (max-width: 640px) {
    .card { padding: 26px 22px; }
    .bubble { max-width: 85%; }
    .header { padding: 12px 14px; }
    .footer { padding: 12px; }
    .header-actions { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ============ TOAST CONTAINER ============ -->
<div id="toast-container" class="toast-container"></div>

<!-- ============ LOGIN ============ -->
<section id="login-view" class="view">
  <div class="card">
    <h1>AI Agent</h1>
    <p class="sub">Sign in to chat with your agent</p>

    <button id="google-btn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="auth-form" class="form" autocomplete="on">
      <input id="name-input" class="input hidden" type="text" placeholder="Name" autocomplete="name" />
      <input id="email-input" class="input" type="email" placeholder="Email" required autocomplete="email" />
      <input id="password-input" class="input" type="password" placeholder="Password" required autocomplete="current-password" minlength="6" />
      <div id="login-error" class="error hidden"></div>
      <button id="submit-btn" class="primary" type="submit">Sign In</button>
    </form>

    <p class="toggle">
      <span id="toggle-text">Don't have an account? </span>
      <a href="#" id="toggle-link">Sign up</a>
    </p>
  </div>
</section>

<!-- ============ LOADING ============ -->
<section id="loading-view" class="view hidden">
  <div class="loading">Loading…</div>
</section>

<!-- ============ CHAT ============ -->
<section id="chat-view" class="view hidden chat-layout">
  <header class="header">
    <div>
      <div class="brand">AI Agent</div>
      <div id="user-label" class="user"></div>
    </div>
    <div class="header-actions">
      <button id="google-connect-btn" class="ghost">🔗 Connect Google</button>
      <button id="signout-btn" class="ghost">Sign out</button>
    </div>
  </header>

  <main id="messages" class="messages">
    <div id="empty-state" class="empty">
      <div class="emoji">👋</div>
      <div>Ask me anything.</div>
    </div>
  </main>

  <footer class="footer">
    <textarea
      id="message-input"
      class="textarea"
      placeholder="Send a message… (Enter to send, Shift+Enter for newline)"
      rows="1"
    ></textarea>
    <button id="send-btn" class="send-btn" disabled>Send</button>
  </footer>
</section>

<script type="module">
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL      = 'https://unotugzxvepijwsdandf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ccM2Fqdy7o3qu_nsTi-HJw_BMqGC2EB';
const API_BASE_URL      = 'http://localhost:8000';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   DOM refs
   ============================================================ */
const $ = (id) => document.getElementById(id);
const loginView      = $('login-view');
const loadingView    = $('loading-view');
const chatView       = $('chat-view');
const authForm       = $('auth-form');
const nameInput      = $('name-input');
const emailInput     = $('email-input');
const passwordInput  = $('password-input');
const submitBtn      = $('submit-btn');
const loginError     = $('login-error');
const googleBtn      = $('google-btn');
const toggleLink     = $('toggle-link');
const toggleText     = $('toggle-text');
const userLabel      = $('user-label');
const messagesEl     = $('messages');
const emptyState     = $('empty-state');
const messageInput   = $('message-input');
const sendBtn        = $('send-btn');
const signoutBtn     = $('signout-btn');
const googleConnectBtn = $('google-connect-btn');
const toastContainer = $('toast-container');

/* ============================================================
   State
   ============================================================ */
let mode = 'login';
let currentUser = null;
let conversationId = null;
let busy = false;

/* ============================================================
   UI Helpers
   ============================================================ */
function show(view) {
  [loginView, loadingView, chatView].forEach((v) => v.classList.add('hidden'));
  view.classList.remove('hidden');
}

function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> <span>${message}</span>`;
  toastContainer.appendChild(toast);
  
  setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease-in forwards';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

/* ============================================================
   API Helpers
   ============================================================ */
async function authHeaders() {
  const { data } = await supabase.auth.getSession();
  const token = data.session?.access_token;
  return {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
  };
}

async function apiCall(path, options = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...options,
    headers: { ...(await authHeaders()), ...(options.headers || {}) },
  });
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail ?? JSON.stringify(body);
    } catch {}
    throw new Error(`${res.status}: ${detail}`);
  }
  return res.json();
}

const api = {
  getMe: () => apiCall('/user/me'),
  chat: (message, conversation_id) =>
    apiCall('/agent/chat', {
      method: 'POST',
      body: JSON.stringify({ message, conversation_id: conversation_id ?? null }),
    }),
  googleConnectUrl: () => apiCall('/integrator/google/connect'),
};

/* ============================================================
   Auth Flow
   ============================================================ */
function userFromSession(session) {
  const u = session.user;
  return {
    id: u.id,
    name: u.user_metadata?.full_name ?? null,
    email: u.email ?? '',
  };
}

function applySession(session) {
  if (!session?.user) {
    currentUser = null;
    conversationId = null;
    messagesEl.querySelectorAll('.row, .err-bar').forEach((el) => el.remove());
    emptyState.classList.remove('hidden');
    show(loginView);
    return;
  }

  // Immediate UI from Supabase
  currentUser = userFromSession(session);
  userLabel.textContent = currentUser.name ?? currentUser.email;
  show(chatView);
  messageInput.focus();

  // --- FIX: Handle Google integration return ---
  const params = new URLSearchParams(window.location.search);
  if (params.get('google') === 'success') {
    showToast('Google account connected successfully!', 'success');
    window.history.replaceState({}, '', window.location.pathname); // Clean URL
  } else if (params.get('google') === 'error') {
    showToast('Failed to connect Google account.', 'error');
    window.history.replaceState({}, '', window.location.pathname);
  }

  // Background sync — failures are ignored
  api.getMe()
    .then((me) => {
      if (me && me.id) {
        currentUser = {
          id: me.id,
          name: me.name ?? currentUser.name,
          email: me.email ?? currentUser.email,
        };
        userLabel.textContent = currentUser.name ?? currentUser.email;
      }
    })
    .catch((e) => console.warn('[sync] /user/me failed (ignored):', e.message));
}

function setAuthBusy(isBusy) {
  submitBtn.disabled = isBusy;
  submitBtn.textContent = isBusy
    ? '…'
    : mode === 'login' ? 'Sign In' : 'Create Account';
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  loginError.classList.add('hidden');
  setAuthBusy(true);
  try {
    if (mode === 'login') {
      const { error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });
      if (error) throw error;
    } else {
      const { error } = await supabase.auth.signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value,
        options: { data: { full_name: nameInput.value.trim() } },
      });
      if (error) throw error;
    }
  } catch (e) {
    loginError.textContent = e.message ?? 'Failed';
    loginError.classList.remove('hidden');
  } finally {
    setAuthBusy(false);
  }
}

function updateAuthMode(newMode) {
  mode = newMode;
  loginError.classList.add('hidden');
  if (mode === 'signup') {
    nameInput.classList.remove('hidden');
    submitBtn.textContent = 'Create Account';
    toggleText.textContent = 'Already have an account? ';
    toggleLink.textContent = 'Log in';
    passwordInput.autocomplete = 'new-password';
  } else {
    nameInput.classList.add('hidden');
    submitBtn.textContent = 'Sign In';
    toggleText.textContent = "Don't have an account? ";
    toggleLink.textContent = 'Sign up';
    passwordInput.autocomplete = 'current-password';
  }
}

async function signInWithGoogle() {
  googleBtn.disabled = true;
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) {
    loginError.textContent = error.message;
    loginError.classList.remove('hidden');
    googleBtn.disabled = false;
  }
}

async function signOut() {
  await supabase.auth.signOut();
}

/* ============================================================
   Chat Flow
   ============================================================ */
function appendMessage(role, content, { thinking = false } = {}) {
  emptyState.classList.add('hidden');
  const row = document.createElement('div');
  row.className = `row ${role === 'user' ? 'user' : 'bot'}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role === 'user' ? 'user' : 'bot'}${thinking ? ' thinking' : ''}`;
  bubble.textContent = content;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { row, bubble };
}

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || busy) return;

  messageInput.value = '';
  messageInput.style.height = 'auto';
  sendBtn.disabled = true;
  busy = true;

  appendMessage('user', text);
  const { row: thinkingRow } = appendMessage('bot', '…thinking', { thinking: true });

  try {
    const res = await api.chat(text, conversationId);
    conversationId = res.conversation_id;
    thinkingRow.remove();
    
    // Extract the bot reply safely
    const botText =
      res?.response?.content ??
      res?.response ??
      (typeof res === 'string' ? res : JSON.stringify(res));
      
    appendMessage('bot', botText);
  } catch (e) {
    thinkingRow.remove();
    showToast(e.message ?? 'Chat failed', 'error');
  } finally {
    busy = false;
    sendBtn.disabled = !messageInput.value.trim();
    messageInput.focus();
  }
}

/* ============================================================
   Google Integration Flow
   ============================================================ */
async function connectGoogle() {
  googleConnectBtn.disabled = true;
  const original = googleConnectBtn.innerHTML;
  googleConnectBtn.innerHTML = 'Connecting…';
  
  try {
    const data = await api.googleConnectUrl();
    const url = data.url || data;
    if (!url) throw new Error('Backend did not return an OAuth URL');
    window.location.href = url;
  } catch (e) {
    showToast(e.message ?? 'Failed to start Google connect', 'error');
    googleConnectBtn.disabled = false;
    googleConnectBtn.innerHTML = original;
  }
}

/* ============================================================
   Event Listeners
   ============================================================ */
authForm.addEventListener('submit', handleAuthSubmit);
googleBtn.addEventListener('click', signInWithGoogle);
signoutBtn.addEventListener('click', signOut);
googleConnectBtn.addEventListener('click', connectGoogle);
sendBtn.addEventListener('click', sendMessage);

toggleLink.addEventListener('click', (e) => {
  e.preventDefault();
  updateAuthMode(mode === 'login' ? 'signup' : 'login');
});

messageInput.addEventListener('input', () => {
  sendBtn.disabled = busy || !messageInput.value.trim();
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
});

messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ============================================================
   Auth State Changes
   ============================================================ */
supabase.auth.onAuthStateChange((event, session) => {
  console.log('[auth]', event, session?.user?.email ?? '(no session)');
  applySession(session);
});

/* ============================================================
   Boot
   ============================================================ */
(async function boot() {
  show(loadingView);
  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    show(loginView);
  }
  // If session exists, onAuthStateChange handles the rest
})();
</script>
</body>
</html>
